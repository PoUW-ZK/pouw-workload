name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect project
        id: detect
        run: |
          if [ -f pyproject.toml ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Dockerfile does not exist yet, nothing to publish."
          fi

      - uses: actions/setup-python@v7
        if: steps.detect.outputs.python == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.detect.outputs.python == 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.detect.outputs.python == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        if: steps.detect.outputs.python == 'true'
        # exit code 5 = tests not exists for now
        run: pytest || [ $? -eq 5 ]

      - name: Vulnerable dependencies (pip-audit)
        if: steps.detect.outputs.python == 'true'
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - name: Dockerfile lint (hadolint)
        if: hashFiles('Dockerfile') != ''
        run: docker run --rm -i ghcr.io/hadolint/hadolint < Dockerfile
